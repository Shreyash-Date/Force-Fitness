<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>BMI Pro — Force Fitness</title>
    <meta name="description" content="Calculate your BMI, healthy weight range, water intake, and daily calories with the Force Fitness BMI Calculator.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💪</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/output.css">
    <style>
        #app {
            box-shadow: 0 8px 30px rgba(0, 0, 0, .18)
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-6">
    <header class="w-[95vw] max-w-7xl flex items-center justify-between py-3 mb-2">
        <a href="../index.html" class="flex flex-col leading-[1.1] font-black md:font-semibold font-['Impact','Haettenschweiler','Arial_Narrow_Bold',sans-serif]" title="Force Fitness Home">
            <span class="text-[1.8rem] tracking-[2px] text-black">Force</span>
            <span class="text-[1.2rem] tracking-[3px] text-gray-700 opacity-80">Fitness</span>
        </a>
        <nav class="flex items-center gap-2 text-sm font-semibold" aria-label="BMI Header Navigation">
            <a href="../index.html" class="px-4 py-2 rounded-full border hover:bg-gray-100 transition">← Home</a>
            <span class="px-4 py-2 rounded-full bg-black text-white font-bold">BMI Calculator</span>
            <a href="workout-planner.html" class="px-4 py-2 rounded-full border hover:bg-gray-100 transition">Workout Planner →</a>
        </nav>
    </header>

    <div id="app" class="bg-white w-[95vw] max-w-7xl md:h-[92vh] h-fit rounded-3xl p-8 grid lg:grid-cols-2 gap-8 my-auto">

        <div class="flex flex-col justify-center">
            <h1 class="text-5xl font-black mb-10">BMI <span class="underline">Calculator</span></h1>

            <div class="grid grid-cols-2 gap-5">
                <div><label class="font-semibold">Height</label>
                    <div class="relative"><input id="height" type="number" placeholder="180"
                            class="w-full border rounded-xl p-3 pr-12 focus:outline-none focus:ring-2 focus:ring-gray-400">
                        <span class="absolute right-4 top-3 text-gray-400">cm</span>
                    </div>
                </div>

                <div><label class="font-semibold">Weight</label>
                    <div class="relative"><input id="weight" type="number" placeholder="70"
                            class="w-full border rounded-xl p-3 pr-12 focus:outline-none focus:ring-2 focus:ring-gray-400">
                        <span class="absolute right-4 top-3 text-gray-400">kg</span>
                    </div>
                </div>

                <div><label class="font-semibold">Age</label>
                    <input id="age" type="number" placeholder="20"
                        class="w-full border rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-gray-400">
                </div>

                <div>
                    <label class="font-semibold">Gender</label>
                    <select id="gender" class="w-full border rounded-xl p-3">
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-4 mt-8">
                <button id="calc"
                    class="flex-1 bg-gray-dark text-white rounded-full py-3 font-bold hover:scale-105 active:scale-95 transition">Calculate</button>
                <button id="clear" class="px-8 border rounded-full hover:bg-gray-100">Clear</button>
            </div>

            <p id="error" class="hidden mt-5 bg-red-100 text-red-700 rounded-xl p-3"></p>
        </div>

        <div class="flex flex-col justify-center">
            <div class="bg-gray-100 rounded-3xl p-6 h-full flex flex-col">

                <div class="flex justify-center">
                    <div class="relative w-56 h-56">
                        <svg class="-rotate-90" width="224" height="224">
                            <circle cx="112" cy="112" r="90" stroke="#d1d5db" stroke-width="18" fill="none" />
                            <circle id="progress" cx="112" cy="112" r="90" stroke="#4D4D4D" stroke-width="18"
                                fill="none" stroke-linecap="round" stroke-dasharray="565.49" stroke-dashoffset="565.49" />
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center">
                            <p id="bmi" class="text-5xl font-black">--</p>
                            <p id="category" class="font-bold text-xl mt-2">---</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-6">
                    <div class="bg-white rounded-xl p-4">
                        <p class="text-gray-500 text-sm">Healthy Weight</p>
                        <p id="healthy" class="font-bold text-xl">--</p>
                    </div>
                    <div class="bg-white rounded-xl p-4">
                        <p class="text-gray-500 text-sm">Water Intake</p>
                        <p id="water" class="font-bold text-xl">--</p>
                    </div>
                    <div class="bg-white rounded-xl p-4">
                        <p class="text-gray-500 text-sm">Calories</p>
                        <p id="calories" class="font-bold text-xl">--</p>
                    </div>
                    <div class="bg-white rounded-xl p-4">
                        <p class="text-gray-500 text-sm">BMI Scale</p>
                        <div class="h-2 bg-gray-300 rounded mt-3 relative">
                            <div id="pointer" class="absolute -top-2 w-6 h-6 rounded-full bg-black"></div>
                        </div>
                    </div>
                </div>


            </div>
        </div>
    </div>
    <script src="../scripts/bmi.js"></script>
</body>

</html>
