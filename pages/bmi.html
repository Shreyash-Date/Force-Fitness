<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>BMI Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../src/output.css">
    <style>
        #app {
            box-shadow: 0 8px 30px rgba(0, 0, 0, .18)
        }
    </style>
</head>

<body class="bg-slate-100 h-screen flex items-center justify-center">
    <div id="app" class="bg-white w-[95vw] max-w-7xl md:h-[92vh] h-fit rounded-3xl p-8 grid lg:grid-cols-2 gap-8">

        <div class="flex flex-col justify-center">
            <h1 class="text-5xl font-black mb-10">BMI <span class="underline">Calculator</span></h1>

            <div class="grid grid-cols-2 gap-5">
                <div><label class="font-semibold">Height</label>
                    <div class="relative"><input id="height" type="number" placeholder="180"
                            class="w-full border rounded-xl p-3 pr-12 focus:outline-none focus:ring-2 focus:ring-gray-400">
                        <span class="absolute right-4 top-3 text-gray-400">cm</span>
                    </div>
                </div>

                <div><label class="font-semibold">Weight</label>
                    <div class="relative"><input id="weight" type="number" placeholder="70"
                            class="w-full border rounded-xl p-3 pr-12 focus:outline-none focus:ring-2 focus:ring-gray-400">
                        <span class="absolute right-4 top-3 text-gray-400">kg</span>
                    </div>
                </div>

                <div><label class="font-semibold">Age</label>
                    <input id="age" type="number" placeholder="20"
                        class="w-full border rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-gray-400">
                </div>

                <div>
                    <label class="font-semibold">Gender</label>
                    <select id="gender" class="w-full border rounded-xl p-3">
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-4 mt-8">
                <button id="calc"
                    class="flex-1 bg-[#4D4D4D] text-white rounded-full py-3 font-bold hover:scale-105 active:scale-95 transition">Calculate</button>
                <button id="clear" class="px-8 border rounded-full hover:bg-gray-100">Clear</button>
            </div>

            <p id="error" class="hidden mt-5 bg-red-100 text-red-700 rounded-xl p-3"></p>
        </div>

        <div class="flex flex-col justify-center">
            <div class="bg-gray-100 rounded-3xl p-6 h-full flex flex-col">

                <div class="flex justify-center">
                    <div class="relative w-56 h-56">
                        <svg class="-rotate-90" width="224" height="224">
                            <circle cx="112" cy="112" r="90" stroke="#d1d5db" stroke-width="18" fill="none" />
                            <circle id="progress" cx="112" cy="112" r="90" stroke="#4D4D4D" stroke-width="18"
                                fill="none" stroke-linecap="round" stroke-dasharray="565" stroke-dashoffset="565" />
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center">
                            <p id="bmi" class="text-5xl font-black">--</p>
                            <p id="category" class="font-bold text-xl mt-2">---</p>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-6">
                    <div class="bg-white rounded-xl p-4">
                        <p class="text-gray-500 text-sm">Healthy Weight</p>
                        <p id="healthy" class="font-bold text-xl">--</p>
                    </div>
                    <div class="bg-white rounded-xl p-4">
                        <p class="text-gray-500 text-sm">Water Intake</p>
                        <p id="water" class="font-bold text-xl">--</p>
                    </div>
                    <div class="bg-white rounded-xl p-4">
                        <p class="text-gray-500 text-sm">Calories</p>
                        <p id="calories" class="font-bold text-xl">--</p>
                    </div>
                    <div class="bg-white rounded-xl p-4">
                        <p class="text-gray-500 text-sm">BMI Scale</p>
                        <div class="h-2 bg-gray-300 rounded mt-3 relative">
                            <div id="pointer" class="absolute -top-2 w-6 h-6 rounded-full bg-black"></div>
                        </div>
                    </div>
                </div>


            </div>
        </div>
    </div>
    <script src="../scripts/bmi.js"></script>
</body>

</html>
